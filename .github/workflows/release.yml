# ============================================================
#  OpenEVSE ESP32 Flasher - Build & Release
#
#  Every push / PR: run tests and build Windows, macOS and Linux
#  executables (uploaded as workflow artifacts).
#  Tags "v*.*.*": additionally publish the three zips on a GitHub Release.
#
#    git tag v1.0.0 && git push origin v1.0.0
# ============================================================

name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            exe: dist/OpenEVSE_ESP32_Flasher/OpenEVSE_ESP32_Flasher.exe   # folder build
          - os: macos-14          # Apple Silicon (arm64)
            platform: macos-arm64
            exe: dist/OpenEVSE_ESP32_Flasher
          - os: macos-15-intel    # Intel (x86_64)
            platform: macos-intel
            exe: dist/OpenEVSE_ESP32_Flasher
          - os: ubuntu-22.04      # older glibc = runs on more distros
            platform: linux
            exe: dist/OpenEVSE_ESP32_Flasher

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = Windows ]; then
            # Compile PyInstaller's bootloader from source: the stock prebuilt
            # one is shared with a lot of malware and is widely flagged by
            # antivirus / Chrome Safe Browsing. Falls back to the wheel if the
            # compile fails.
            (
              set -e
              pip download --no-deps --no-binary :all: pyinstaller -d pi_src
              tar xzf pi_src/pyinstaller-*.tar.gz -C pi_src
              cd pi_src/pyinstaller-*/bootloader
              python ./waf all --target-arch=64bit
              cd ..
              pip install .
            ) || { echo "::warning::Bootloader compile failed - using stock PyInstaller"; pip install pyinstaller; }
          else
            pip install pyinstaller
          fi
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch Windows USB drivers
        if: runner.os == 'Windows'
        env:
          CP210X_DRIVER_URL: ${{ vars.CP210X_DRIVER_URL }}
        run: python scripts/fetch_drivers.py --allow-missing

      - name: Build executable
        run: pyinstaller --noconfirm openevse_esp32_flasher.spec

      - name: Sign Windows executable
        # Optional Authenticode signing. Add repository secrets
        # WINDOWS_CERT_PFX (base64 of the .pfx) and WINDOWS_CERT_PASSWORD to enable.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) { Write-Host "No signing certificate configured - skipping."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 "${{ matrix.exe }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $pfx

      - name: Smoke test bundled esptool
        shell: bash
        run: |
          out=$(${{ matrix.exe }} esptool version)
          echo "$out"
          echo "$out" | grep -E '^[0-9]+\.[0-9]+'

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Recurse dist\OpenEVSE_ESP32_Flasher\* release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath OpenEVSE_ESP32_Flasher-windows.zip -Force

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release
          cp ${{ matrix.exe }} release/
          chmod +x release/OpenEVSE_ESP32_Flasher
          cp README.md release/
          if [ "${{ matrix.platform }}" = linux ]; then cp drivers/linux/*.rules release/; fi
          cd release && zip -qr ../OpenEVSE_ESP32_Flasher-${{ matrix.platform }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: OpenEVSE_ESP32_Flasher-${{ matrix.platform }}
          path: OpenEVSE_ESP32_Flasher-${{ matrix.platform }}.zip

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
          fail_on_unmatched_files: true
